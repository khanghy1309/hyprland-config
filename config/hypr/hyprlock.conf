# ~/.config/hypr/hyprlock.conf — màn hình khóa kính
# hyprlock 0.9 vẫn dùng cú pháp hyprlang (khác với hyprland.lua).
# Tài liệu: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font     = Inter
$fontMono = JetBrains Mono
$glass    = rgba(18, 20, 24, 0.40)
$rim      = rgba(255, 255, 255, 0.30)
$fg       = rgb(243, 246, 246)

general {
    hide_cursor = false
    ignore_empty_input = true
    compositor_fade = true
}

# bật nếu máy có cảm biến vân tay (cần gói fprintd)
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Chạm vân tay để mở khóa
#         present_message = Đang quét…
#     }
# }

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# Nền: ảnh chụp màn hình lúc khóa, làm mờ và tối đi một chút
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.72
    vibrancy = 0.2
}

# ── viên "Đã khóa" ở trên cùng ──
shape {
    monitor =
    size = 132, 42
    rounding = -1
    color = $glass
    border_size = 1
    border_color = $rim
    position = 0, -36
    halign = center
    valign = top
    zindex = 0
}
label {
    monitor =
    text = Đã khóa
    color = $fg
    font_size = 14
    font_family = $font SemiBold
    position = 0, -46
    halign = center
    valign = top
    zindex = 1
}

# ── ngày và giờ ──
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/vndate.sh
    color = $fg
    font_size = 26
    font_family = $font SemiBold
    position = 0, -128
    halign = center
    valign = top
}
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.92)
    font_size = 190
    font_family = $font Light
    position = 0, -168
    halign = center
    valign = top
}

# ── ảnh đại diện: vòng tròn có chữ cái đầu, phủ ảnh ~/.face nếu có ──
shape {
    monitor =
    size = 76, 76
    rounding = -1
    color = $glass
    border_size = 1
    border_color = $rim
    position = 0, 226
    halign = center
    valign = bottom
    zindex = 0
}
label {
    monitor =
    text = cmd[update:0] whoami | cut -c1 | tr '[:lower:]' '[:upper:]'
    color = $fg
    font_size = 28
    font_family = $font SemiBold
    position = 0, 246
    halign = center
    valign = bottom
    zindex = 1
}
image {
    monitor =
    path = ~/.face
    size = 76
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.45)
    position = 0, 226
    halign = center
    valign = bottom
    zindex = 2
}

# ── tên người dùng ──
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 17
    font_family = $font SemiBold
    position = 0, 186
    halign = center
    valign = bottom
}

# ── ô mật khẩu ──
input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(18, 20, 24, 0.45)
    outer_color = $rim
    check_color = rgba(255, 255, 255, 0.70)
    fail_color = rgba(242, 139, 130, 0.90)
    capslock_color = rgba(244, 220, 182, 0.90)
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    placeholder_text = <span foreground="##c5d0d2">Nhập mật khẩu</span>
    check_text = Đang kiểm tra…
    fail_text = Sai mật khẩu ($ATTEMPTS)
    position = 0, 120
    halign = center
    valign = bottom
}

# ── góc dưới: pin và bố cục bàn phím ──
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/battery.sh
    color = $fg
    font_size = 12
    font_family = $fontMono
    position = 36, 34
    halign = left
    valign = bottom
}
label {
    monitor =
    text = $LAYOUT
    color = $fg
    font_size = 12
    font_family = $fontMono
    position = -36, 34
    halign = right
    valign = bottom
}
