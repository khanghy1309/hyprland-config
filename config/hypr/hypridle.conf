# ~/.config/hypr/hypridle.conf — tự làm tối, khóa, tắt màn hình, ngủ khi không dùng máy
# hypridle 0.1 vẫn dùng cú pháp hyprlang.
# Tài liệu: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock                              # không mở hai màn hình khóa
    before_sleep_cmd = loginctl lock-session                           # khóa trước khi ngủ
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'  # bật màn hình khi thức dậy
    ignore_dbus_inhibit = false                                        # xem phim/họp video thì không tự khóa
}

# 2,5 phút: làm tối màn hình (laptop)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%      # 10% chứ không phải mức thô 10 (gần như tắt đèn trên nhiều máy)
    on-resume = brightnessctl -r
}

# Tắt đèn bàn phím. Bỏ dấu # nếu máy có đèn bàn phím
# (xem tên thiết bị bằng: brightnessctl -l).
# listener {
#     timeout = 150
#     on-timeout = brightnessctl -sd kbd_backlight set 0
#     on-resume = brightnessctl -rd kbd_backlight
# }

# 5 phút: khóa màn hình
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 phút: tắt màn hình
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 phút: cho máy ngủ
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
