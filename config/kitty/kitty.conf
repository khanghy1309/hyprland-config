# kitty — terminal kính trong, theo Liquid Glass
# Tài liệu: https://sw.kovidgoyal.net/kitty/conf/
# Phông chữ và độ trong đổi trong Cài đặt → Giao diện → Terminal (ghi vào lg-settings.conf ở dưới).
# Chỉnh riêng thì viết vào user.conf cùng thư mục (được đọc sau cùng, không bị ghi đè).

# ── chữ ──
font_family      Geist Mono
font_size        11.5
disable_ligatures never
# biểu tượng của eza, starship... (Nerd Font) đã có sẵn trong kitty, không cần cài phông riêng

# ── kính ──
# nền trong suốt để thấy lớp kính mờ của Hyprland phía sau; Ctrl + Shift + A rồi M / L để đậm / nhạt tạm thời
background_opacity 0.62
dynamic_background_opacity yes
window_padding_width 14 18
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
window_alert_on_bell no

# ── con trỏ ──
cursor_shape beam
cursor_blink_interval 0.6
# vệt mờ theo con trỏ khi nó nhảy xa (chuyển dòng, chọn trong menu); bỏ qua khi màn hình đang vẽ lại liên tục
cursor_trail 200
cursor_trail_decay 0.1 0.4

# ── tab (Ctrl + Shift + T mở tab mới, Ctrl + Shift + ← → chuyển tab) ──
tab_bar_edge top
tab_bar_style separator
tab_separator "   "
tab_bar_min_tabs 2
tab_bar_margin_width 10
tab_bar_margin_height 6 2
tab_title_template " {index}  {title} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── chép, dán, đường link: như Windows ──
# Ctrl + C chép khi đang chọn chữ, không chọn gì thì vẫn là dừng lệnh như thường; Ctrl + V dán
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# chọn chữ bằng chuột là đã chép vào vùng chọn (dán bằng chuột giữa)
copy_on_select no
strip_trailing_spaces smart
url_style curly
detect_urls yes
show_hyperlink_targets yes
# bấm vào đường link là mở trong trình duyệt
open_url_with default
scrollback_lines 10000

# ── shell ──
# fish: tự gợi ý lệnh theo lịch sử, tô màu khi gõ (cấu hình: ~/.config/fish/conf.d/liquid-glass.fish).
# Shell đăng nhập của máy vẫn là bash; chỉ terminal này dùng fish. Máy chưa cài fish thì mở bash,
# để terminal vẫn dùng được (kitty bỏ cuộc nếu "shell fish" mà không có fish).
# Vì chạy qua sh, kitty không tự gắn shell integration cho fish: liquid-glass.fish tự gắn.
shell sh -c 'command -v fish >/dev/null 2>&1 && LG_KSI=1 exec fish || exec bash'
shell_integration enabled

# Bảng màu "clear-glass"
include glass-theme.conf
# phông và độ trong do Cài đặt ghi; cấu hình riêng của bạn
globinclude lg-settings.conf
globinclude user.conf
