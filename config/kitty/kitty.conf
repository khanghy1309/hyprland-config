# kitty — terminal kính trong
# Tài liệu: https://sw.kovidgoyal.net/kitty/conf/

font_family      JetBrains Mono
font_size        11.5
disable_ligatures never

# Nền trong suốt để thấy lớp kính mờ của Hyprland phía sau
background_opacity 0.55
dynamic_background_opacity yes

window_padding_width 18 22
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_blink_interval 0.6

# Bảng màu "clear-glass"
include glass-theme.conf
