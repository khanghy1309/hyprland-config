<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}svg{display:block}</style>
</head><body>
<!-- Khung vẽ 1200×560 (gấp đôi khung 600×280). Dùng: render.js gọi frame(kind, p) rồi chụp. -->
<svg id="s" width="1200" height="560" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#d9ccff"/>
      <stop offset="0.5" stop-color="#ffd1e8"/>
      <stop offset="1" stop-color="#c8f5ea"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="tipglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <g id="glowLayer" filter="url(#glow)" opacity="0.55"></g>
  <g id="inkLayer"></g>
  <circle id="tip" r="5" fill="#fff" filter="url(#tipglow)" opacity="0"/>
  <circle id="tip2" r="1.8" fill="#fff" opacity="0"/>
</svg>
<script>
// Catmull-Rom qua các điểm → đường cong Bézier mượt
function smooth(pts, tension = 0.5) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1 = [p1[0] + (p2[0] - p0[0]) * tension / 3, p1[1] + (p2[1] - p0[1]) * tension / 3];
    const c2 = [p2[0] - (p3[0] - p1[0]) * tension / 3, p2[1] - (p3[1] - p1[1]) * tension / 3];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

// "hello" viết liền một nét (tự thiết kế), toạ độ trong khung 600×280
const HELLO = [[
  [70, 196], [96, 186], [124, 160], [148, 118], [160, 82], [158, 60], [146, 56], [136, 70], [130, 110], [126, 160], [124, 196],
  [128, 172], [140, 150], [156, 140], [170, 146], [174, 166], [172, 190], [184, 198], [204, 186],
  [222, 170], [240, 160], [250, 147], [244, 136], [228, 138], [216, 156], [216, 180], [232, 196], [256, 194], [276, 178],
  [296, 146], [310, 104], [312, 70], [302, 58], [292, 70], [288, 110], [290, 160], [300, 192], [318, 194], [334, 180],
  [352, 146], [366, 104], [368, 70], [358, 58], [348, 70], [344, 110], [346, 160], [356, 192], [374, 194], [392, 182],
  [404, 164], [418, 146], [438, 142], [452, 158], [448, 184], [430, 196], [412, 188], [410, 166], [424, 148], [446, 144], [470, 142], [500, 132]
]];

// chữ ký: theo nét tay gốc (khung 300×337), dời và phóng vào giữa khung vẽ
const SIG_RAW = [
  // nét 1: móc trên, thân dọc, giọt lá bên trái, gạch ngang, lên đỉnh phải
  [[58, 103], [70, 88], [88, 80], [95, 92], [96, 125], [92, 150], [80, 175], [62, 198], [56, 180], [58, 158],
   [72, 140], [92, 124], [112, 123], [132, 128], [150, 120], [163, 105]],
  // nét 2: thân phải xuống, vòng nhỏ, móc dưới, nét quét chéo
  [[163, 105], [160, 140], [154, 170], [143, 196], [128, 184], [108, 178], [100, 192], [106, 212], [122, 216], [140, 200],
   [150, 220], [150, 240], [132, 251], [106, 252], [102, 264], [118, 268], [140, 252], [160, 262], [178, 275]],
  // hai dấu nhỏ bên phải
  [[193, 80], [205, 83], [211, 95], [206, 106], [198, 111]],
  [[237, 68], [247, 77], [248, 89], [236, 95], [224, 100]]
];
const SIG = SIG_RAW.map(st => st.map(([x, y]) => [Math.round((x - 150) * 0.92 + 300), Math.round((y - 175) * 0.92 + 145)]));

const NS = "http://www.w3.org/2000/svg";
function build(strokes, width) {
  const ink = document.getElementById("inkLayer"), glow = document.getElementById("glowLayer");
  ink.innerHTML = ""; glow.innerHTML = "";
  const out = [];
  for (const st of strokes) {
    const d = smooth(st);
    const mk = (parent, w, color) => {
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", d); p.setAttribute("fill", "none");
      p.setAttribute("stroke", color); p.setAttribute("stroke-width", w);
      p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round");
      parent.appendChild(p);
      return p;
    };
    const g = mk(glow, width * 2.6, "#e8d8ff");
    const p = mk(ink, width, "url(#ink)");
    const len = p.getTotalLength();
    for (const q of [g, p]) { q.style.strokeDasharray = len + " " + len; q.style.strokeDashoffset = len; }
    out.push({ p, g, len });
  }
  return out;
}

let cur = null, curKind = "";
// vẽ đến tiến độ p (0..1) của toàn bộ nét; tip = hiện đầu bút sáng
// layer: "all" | "ink" (nét sắc) | "glow" (quầng sáng, Plymouth phóng to lại)
window.frame = function (kind, p, tip = true, layer = "all") {
  document.getElementById("inkLayer").style.display = layer === "glow" ? "none" : "";
  document.getElementById("glowLayer").style.display = layer === "ink" ? "none" : "";
  if (curKind !== kind) { cur = build(kind === "hello" ? HELLO : SIG, kind === "hello" ? 6 : 5.2); curKind = kind; }
  const total = cur.reduce((a, s) => a + s.len, 0);
  let left = p * total, tipPt = null;
  for (const s of cur) {
    const shown = Math.max(0, Math.min(s.len, left));
    for (const q of [s.p, s.g]) q.style.strokeDashoffset = s.len - shown;
    if (shown > 0 && shown < s.len) tipPt = s.p.getPointAtLength(shown);
    left -= s.len;
  }
  for (const id of ["tip", "tip2"]) {
    const c = document.getElementById(id);
    const want = id === "tip" ? layer !== "ink" : layer !== "glow";
    c.setAttribute("opacity", tip && tipPt && want ? 1 : 0);
    if (tipPt) { c.setAttribute("cx", tipPt.x); c.setAttribute("cy", tipPt.y); }
  }
};
// ảnh hào quang riêng của chữ ký (để Plymouth làm nhịp sáng)
window.glowOnly = function () {
  frame("sig", 1, false);
  document.getElementById("inkLayer").style.display = "none";
  const gl = document.getElementById("glowLayer");
  gl.setAttribute("opacity", "0.9");
  gl.querySelectorAll("path").forEach(p => p.setAttribute("stroke-width", 16));
};
</script>
</body></html>
